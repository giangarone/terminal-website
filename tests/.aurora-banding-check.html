<!doctype html><meta charset="utf-8"><title>Aurora rendering comparison</title>
<style>body{margin:24px;background:#080808;color:#ddd;font:14px system-ui}main{display:flex;gap:16px}figure{margin:0}canvas{width:512px;height:512px;}pre{white-space:pre-wrap}</style>
<h1>Same wave, before and after</h1><main></main><pre id="result">Running WebGL checks…</pre>
<script>
const versions = {"before":{"vertex":"\nattribute vec2 aPos;\nvarying vec2 vUv;\nvoid main() {\n  vUv = aPos * 0.5 + 0.5;\n  gl_Position = vec4(aPos, 0.0, 1.0);\n}","fragment":"\nprecision highp float;\n\nvarying vec2 vUv;\nuniform float uTime;\nuniform float uIntensity;\nuniform float uGrain;\nuniform vec3 uColorA;\nuniform vec3 uColorB;\nuniform vec3 uColorC;\nuniform float uSpread;\nuniform float uDiag;\nuniform vec2 uEdgeFade;\n\nvec3 warp3d(vec3 pos, float t) {\n  // Unequal fold widths and independent drift give the light its own rhythm.\n  pos *= vec3(1.9, 2.05, 1.85);\n  pos.x += 0.78 * sin(0.86 * t + 1.82 * pos.y + 0.35) + t * 0.54;\n  pos.y += 0.70 * cos(0.72 * t + 2.08 * pos.x);\n  pos.y += 0.82 * sin(0.94 * t + 1.74 * pos.z + 0.60) + t * 0.60;\n  pos.z += 0.66 * cos(0.78 * t + 1.96 * pos.y);\n  pos.z += 0.76 * sin(0.90 * t + 1.88 * pos.x) + t * 0.48;\n  pos.x += 0.72 * cos(0.82 * t + 1.80 * pos.z);\n  return 0.5 + 0.5 * cos(pos + vec3(0.8, 2.3, 4.25));\n}\n\nvoid main() {\n  vec2 uv = 2.0 * vUv - 1.0;\n  // Bend the folds gently without moving the hero's outer fade boundaries.\n  vec2 flowUv = uv + vec2(\n    0.08 * sin(2.4 * uv.y + 0.33 * uTime),\n    0.045 * sin(2.0 * uv.x - 0.22 * uTime + 0.4)\n  );\n  // GPU rounding can push cosine-derived values below zero; fractional pow\n  // is undefined there and produces black specks. Keep its input in range.\n  vec3 wave = clamp(warp3d(vec3(flowUv.x, sin(flowUv.y), flowUv.y), uTime), 0.0, 1.0);\n  vec3 w = pow(wave, vec3(1.5));\n  vec3 tint = mix(uColorB, uColorA, smoothstep(0.1, 0.9, w.y));\n  tint = mix(tint, uColorC, 0.6 * smoothstep(0.25, 0.9, w.z));\n  float density = 0.9 * w.x * w.y + 0.65 * w.z;\n  density *= smoothstep(uSpread, 1.0, abs(uv.y));\n  float m = smoothstep(uDiag, 1.0, -uv.y * uv.x);\n  density *= m * m;\n  float edgeFade = uv.y > 0.0 ? uEdgeFade.x : uEdgeFade.y;\n  density *= smoothstep(0.0, max(edgeFade, 0.0001), 1.0 - abs(uv.y));\n  // Compress bright folds smoothly to keep the monochrome glow soft.\n  float glow = 1.0 - exp(-density * uIntensity);\n  vec3 col = tint * glow;\n  // Static, pixel-sized noise breaks up 8-bit steps before the canvas is\n  // composited. Keep it strong through dark fades, tapering only at black.\n  float n = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));\n  float grainMask = smoothstep(0.0, 0.01, glow);\n  col = clamp(col + (n - 0.5) * uGrain * grainMask, 0.0, glow);\n  gl_FragColor = vec4(col, glow);\n}"},"after":{"vertex":"\nattribute vec2 aPos;\nvarying vec2 vUv;\nvoid main() {\n  vUv = aPos * 0.5 + 0.5;\n  gl_Position = vec4(aPos, 0.0, 1.0);\n}","fragment":"\nprecision highp float;\n\nvarying vec2 vUv;\nuniform float uTime;\nuniform float uIntensity;\nuniform float uGrain;\nuniform vec3 uColorA;\nuniform vec3 uColorB;\nuniform vec3 uColorC;\nuniform vec3 uBackground;\nuniform float uSpread;\nuniform float uDiag;\nuniform vec2 uEdgeFade;\n\nvec3 warp3d(vec3 pos, float t) {\n  // Unequal fold widths and independent drift give the light its own rhythm.\n  pos *= vec3(1.9, 2.05, 1.85);\n  pos.x += 0.78 * sin(0.86 * t + 1.82 * pos.y + 0.35) + t * 0.54;\n  pos.y += 0.70 * cos(0.72 * t + 2.08 * pos.x);\n  pos.y += 0.82 * sin(0.94 * t + 1.74 * pos.z + 0.60) + t * 0.60;\n  pos.z += 0.66 * cos(0.78 * t + 1.96 * pos.y);\n  pos.z += 0.76 * sin(0.90 * t + 1.88 * pos.x) + t * 0.48;\n  pos.x += 0.72 * cos(0.82 * t + 1.80 * pos.z);\n  return 0.5 + 0.5 * cos(pos + vec3(0.8, 2.3, 4.25));\n}\n\nvoid main() {\n  vec2 uv = 2.0 * vUv - 1.0;\n  // Bend the folds gently without moving the hero's outer fade boundaries.\n  vec2 flowUv = uv + vec2(\n    0.08 * sin(2.4 * uv.y + 0.33 * uTime),\n    0.045 * sin(2.0 * uv.x - 0.22 * uTime + 0.4)\n  );\n  // GPU rounding can push cosine-derived values below zero; fractional pow\n  // is undefined there and produces black specks. Keep its input in range.\n  vec3 wave = clamp(warp3d(vec3(flowUv.x, sin(flowUv.y), flowUv.y), uTime), 0.0, 1.0);\n  vec3 w = pow(wave, vec3(1.5));\n  vec3 tint = mix(uColorB, uColorA, smoothstep(0.1, 0.9, w.y));\n  tint = mix(tint, uColorC, 0.6 * smoothstep(0.25, 0.9, w.z));\n  float density = 0.9 * w.x * w.y + 0.65 * w.z;\n  density *= smoothstep(uSpread, 1.0, abs(uv.y));\n  float m = smoothstep(uDiag, 1.0, -uv.y * uv.x);\n  density *= m * m;\n  float edgeFade = uv.y > 0.0 ? uEdgeFade.x : uEdgeFade.y;\n  density *= smoothstep(0.0, max(edgeFade, 0.0001), 1.0 - abs(uv.y));\n  // Compress bright folds smoothly to keep the monochrome glow soft.\n  float glow = 1.0 - exp(-density * uIntensity);\n  // Compose the screen-style glow against the page color before quantizing.\n  vec3 col = uBackground + (1.0 - uBackground) * tint * glow;\n  // Uncorrelated, static grain avoids visible diagonal patterns. Give it\n  // several 8-bit levels of headroom so it survives browser compositing.\n  vec3 noise = fract(gl_FragCoord.xyx * vec3(0.1031, 0.1030, 0.0973));\n  noise += dot(noise, noise.yzx + 33.33);\n  float n = fract((noise.x + noise.y) * noise.z);\n  float grainMask = smoothstep(0.0, 0.02, glow);\n  col = clamp(col + (n - 0.5) * uGrain * grainMask, 0.0, 1.0);\n  // The opaque result already matches the page at the edges, avoiding a\n  // second gradient in alpha and another CSS blending/quantization step.\n  gl_FragColor = vec4(col, 1.0);\n}"}};
function renderer(version, grain, alpha) {
  const canvas=document.createElement('canvas'); canvas.width=canvas.height=512; if(alpha)canvas.style.mixBlendMode='screen';
  const gl=canvas.getContext('webgl',{alpha,depth:false,stencil:false,antialias:false,preserveDrawingBuffer:true});
  if(!gl) throw Error('WebGL unavailable');
  const compile=(type,source)=>{const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));return shader;};
  const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,version.vertex));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,version.fragment));gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const position=gl.getAttribLocation(program,'aPos');gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
  for(const [name,value] of Object.entries({uColorA:184/255,uColorB:164/255,uColorC:214/255})) gl.uniform3f(gl.getUniformLocation(program,name),value,value,value);
  gl.uniform3f(gl.getUniformLocation(program,'uBackground'),8/255,8/255,8/255); for(const [name,value] of Object.entries({uSpread:0.27,uDiag:-1,uGrain:grain})) gl.uniform1f(gl.getUniformLocation(program,name),value);
  gl.uniform2f(gl.getUniformLocation(program,'uEdgeFade'),0.2,0.32);
  const pixels=new Uint8Array(512*512*4);
  return {canvas,draw(time,intensity=2){gl.uniform1f(gl.getUniformLocation(program,'uTime'),time);gl.uniform1f(gl.getUniformLocation(program,'uIntensity'),intensity);gl.drawArrays(gl.TRIANGLES,0,3);gl.readPixels(0,0,512,512,gl.RGBA,gl.UNSIGNED_BYTE,pixels);if(gl.getError()!==gl.NO_ERROR)throw Error('WebGL rendering error');return pixels.slice();}};
}
try {
  const before=renderer(versions.before,2/255,true),after=renderer(versions.after,8/255,false),reference=renderer(versions.after,0,false);
  const phases=[];
  for(const time of [0,6.24,12,24]) {
    const old=before.draw(time),next=after.draw(time),base=reference.draw(time),repeat=after.draw(time);
    let samples=0,oldNoiseEnergy=0,newNoiseEnergy=0,meanShift=0,maxChannelDifference=0;
    for(let p=0;p<base.length-4;p+=4){
      maxChannelDifference=Math.max(maxChannelDifference,Math.abs(next[p]-next[p+1]),Math.abs(next[p]-next[p+2]));
      if(p%2048===2044||base[p]<13||base[p]>48||Math.abs(base[p]-base[p+4])>1)continue;
      samples++;oldNoiseEnergy+=(Math.round(8+(1-8/255)*old[p])-base[p])**2;newNoiseEnergy+=(next[p]-base[p])**2;meanShift+=next[p]-base[p];
    }
    const staticGrain=next.every((value,index)=>value===repeat[index]);
    if(!staticGrain||maxChannelDifference!==0||Math.abs(meanShift/samples)>1)throw Error('Grain stability, monochrome, or brightness check failed');
    phases.push({time,darkGradientSamples:samples,beforeNoiseRmsLevels:Math.round(Math.sqrt(oldNoiseEnergy/samples)*100)/100,afterNoiseRmsLevels:Math.round(Math.sqrt(newNoiseEnergy/samples)*100)/100,meanBrightnessShift:Math.round(meanShift/samples*100)/100,staticGrain,monochrome:maxChannelDifference===0});
  }
  const black=after.draw(6.24,0);
  const cleanBlack=black.every((value,index)=>index%4===3?value===255:value===8);
  if(!cleanBlack)throw Error('Black background or entrance fade was lifted');
  before.draw(6.24);after.draw(6.24);
  for(const [label,item] of [['Before',before],['After',after]]){const figure=document.createElement('figure');const caption=document.createElement('figcaption');caption.textContent=label;figure.append(caption,item.canvas);document.querySelector('main').append(figure);}
  document.getElementById('result').textContent=JSON.stringify({passed:true,cleanBlack,phases},null,2);
} catch(error) {document.getElementById('result').textContent=JSON.stringify({passed:false,error:String(error)});}
</script>
